# Project: PowerGlove Vision
# File: pyproject.toml
# Purpose: Define Python packaging metadata, dependencies, console commands, and source layout.
# Author: Iain Bennett
# Copyright (c) 2026 Iain Bennett
# SPDX-License-Identifier: MIT
# Change log:
#   2026-09-02 - Added to PowerGlove Vision.
#   2026-09-03 - Standardized source documentation and maintenance metadata.
# Full history: docs/CHANGELOG.md and Git history.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "powerglove-vision"
version = "0.1.0"
description = "Camera-only Power Glove-inspired controller for UNO Q and RetroPie"
license = {file = "LICENSE"}
requires-python = ">=3.7"
classifiers = ["License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
vision = [
  "mediapipe>=1.0.1,<2",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]
receiver = ["evdev>=1.7"]
dev = []

[project.scripts]
powerglove-vision = "powerglove_vision.vision_app:main"
powerglove-receiver = "powerglove_vision.receiver:main"
powerglove-profile = "powerglove_vision.profile_control:main"
powerglove-retropie-hook = "powerglove_vision.retropie_hook:main"
powerglove-pair = "powerglove_vision.pairing:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Project: PowerGlove Vision
# File: .github/workflows/quality.yml
# Purpose: Test supported Python versions and verify source, documentation, PDFs, and the public package.
# Author: Iain Bennett
# Copyright (c) 2026 Iain Bennett
# SPDX-License-Identifier: MIT
# Change log:
#   2026-09-03 - Added automated tests, audits, syntax checks, and package verification.
# Full history: docs/CHANGELOG.md and Git history.

name: Quality and package verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m compileall -q python scripts src tests
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  documentation-and-package:
    name: Documentation and public package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes rsync zip
          python -m pip install --disable-pip-version-check reportlab pypdf
      - name: Audit source and documentation
        run: |
          scripts/check-source-docs.py
          scripts/check-documentation.py
      - name: Check shell and JSON syntax
        run: |
          for file in scripts/*.sh; do bash -n "$file"; done
          for file in retropie/bin/* retropie/*.sh; do sh -n "$file"; done
          python -m json.tool config/device.example.json >/dev/null
          python -m json.tool config/games.json >/dev/null
          python -m json.tool config/launcher.example.json >/dev/null
          python -m json.tool config/profiles.json >/dev/null
      - name: Rebuild and inspect PDF editions
        run: |
          python scripts/build-docs-pdf.py
          scripts/check-documentation.py --require-pdfs
      - name: Build and verify public App Lab package
        run: |
          scripts/build-app-lab-package.sh
          scripts/verify-app-lab-package.py
      - name: Publish verified App Lab package
        uses: actions/upload-artifact@v4
        with:
          name: PowerGlove-Vision-Uno-Q
          path: output/app-lab/PowerGlove-Vision-Uno-Q.zip
          if-no-files-found: error
          retention-days: 14
